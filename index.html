:root{--paper:#faf7ef;--ink:#1c3029;--secondary:#4d5a50;--rule:#cec6b4;--rust:#874327;--sans:Jost,'Trebuchet MS',sans-serif;--serif:Cormorant,Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);background:var(--paper);font-family:var(--sans)}[hidden]{display:none!important}
button{background:transparent;color:inherit;font:inherit;border:0;cursor:pointer;min-height:44px}button:focus-visible,a:focus-visible,.pin:focus-visible .badge{outline:3px solid #a34724;outline-offset:3px}button:disabled{cursor:default}
.page{width:min(100%,1800px);min-height:100svh;margin:auto;display:grid;grid-template-rows:auto 1fr auto;padding:0 clamp(20px,4.2vw,76px)}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:20px}
header{border-bottom:1px solid var(--rule);padding:12px 0}h1{margin:0;font:600 clamp(21px,2vw,32px)/1.18 var(--serif)}
#sources,#close{font-size:16px;text-decoration:underline;text-underline-offset:4px;color:var(--secondary);padding:4px 0}
main{display:grid;grid-template-columns:minmax(0,.76fr) minmax(0,1.24fr);align-items:stretch;margin:clamp(18px,3.4vh,38px) 0;gap:clamp(24px,4vw,80px)}
figure{margin:0;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:310px;border:1px solid var(--rule);background:#efe5cd;align-self:stretch}
#map-frame{overflow:hidden;isolation:isolate;position:relative;min-height:0}
#map-frame>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#unmapped{height:100%;margin:0;display:grid;place-items:center;text-align:center;color:#625c49;font:italic 500 clamp(17px,2.4vw,34px)/1.2 var(--serif)}
figcaption{display:grid;gap:3px;padding:16px clamp(14px,1.8vw,28px);background:#f3edde;border-top:1px solid var(--rule)}
.label{font:600 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--rust)}
figcaption strong{font:600 clamp(24px,2.3vw,38px)/1.05 var(--serif)}
#map-caption{font-size:clamp(14px,1.04vw,19px);line-height:1.35;color:var(--secondary)}#map-caption:empty{display:none}
.pin{cursor:pointer;touch-action:manipulation}.pin line{stroke:#715a39;stroke-width:1.4;vector-effect:non-scaling-stroke}.pin .dot{fill:#584c35}.pin .badge{fill:#f8f2e2;stroke:#7c694d;stroke-width:1.3}.pin text{font:600 15px var(--sans);text-anchor:middle;fill:#423725;pointer-events:none}.pin.selected .badge{fill:#884426;stroke:#fff2d8;stroke-width:2}.pin.selected .dot{fill:#854223}.pin.selected text{fill:white}
article{display:flex;align-items:center}.reading{width:min(100%,78ch)}.type{margin-bottom:10px}
article h2{font:600 clamp(44px,4.8vw,84px)/1 var(--serif);letter-spacing:-.027em;margin:0;text-wrap:balance}
.citation{font-size:clamp(16px,1.4vw,23px);line-height:1.35;color:var(--secondary);margin:12px 0 20px}.citation cite{font-style:italic}
#script{border-top:1px solid var(--rule);padding-top:clamp(14px,2.7vh,30px);font-size:clamp(24px,2.2vw,38px);line-height:1.38;font-weight:400}
#script p{margin:0}#script p+p{margin-top:.65em}
footer{border-top:1px solid var(--rule);padding:10px 0 12px;font-size:17px}
#progress{color:var(--secondary);font-variant-numeric:tabular-nums}nav{display:flex;align-items:center;gap:12px}nav button{padding:8px 17px;border-radius:3px}#back:disabled{opacity:.43}

  <script>const stops=[{"name":"Wild-goose chase","kind":"Idiom","place":"Verona, Italy","pin":"Verona","xy":[859,569],"quote":"“Nay, if our wits run the wild-goose chase, I am done…”","speaker":"Mercutio to Romeo","play":"Romeo and Juliet","scene":"Act 2, scene 4","url":"https://www.folger.edu/explore/shakespeares-works/romeo-and-juliet/read/2/4/","sources":["goose","phrases"],"setting":"","speech":["A wild-goose chase was a horse race: the riders followed the leader like geese in flight. Mercutio uses it to joke that he can’t keep up with Romeo’s puns.","Today, a wild-goose chase is a search that gets you nowhere."]},{"name":"Break the ice","kind":"Idiom","place":"Padua, Italy","pin":"Padua","xy":[885,570],"quote":"“And if you break the ice and do this feat…”","speaker":"Tranio, disguised as Lucentio, to Petruchio","play":"The Taming of the Shrew","scene":"Act 1, scene 2","url":"https://www.folger.edu/explore/shakespeares-works/the-taming-of-the-shrew/read/1/2/","sources":["phrases"],"setting":"","speech":["Bianca’s father says her older sister must marry first. If Petruchio marries her sister, he’ll “break the ice” and clear the way for Bianca’s suitors.","Today, we break the ice when we help people feel comfortable at a first meeting."]},{"name":"All that glisters is not gold","kind":"Proverb","place":"Belmont","pin":"Venice","xy":[899,569],"quote":"“All that glisters is not gold”","speaker":"The Prince of Morocco, reading a scroll aloud","play":"The Merchant of Venice","scene":"Act 2, scene 7","url":"https://www.folger.edu/explore/shakespeares-works/the-merchant-of-venice/read/2/7/","sources":["gold","belmont","phrases"],"setting":"Belmont is fictional. The dot marks Venice.","speech":["A prince chooses a gold box hoping to marry Portia. Inside, he finds a skull. Chaucer had used the same warning about appearances more than 200 years earlier.","Today, we say “glitters” instead of “glisters.” Both mean “shines.” The lesson is the same: looks can fool you."]},{"name":"Green-eyed monster","kind":"Metaphor","place":"Cyprus","pin":"Cyprus","xy":[1523,925],"quote":"“O, beware, my lord, of jealousy! It is the green-eyed monster…”","speaker":"Iago to Othello","play":"Othello","scene":"Act 3, scene 3","url":"https://www.folger.edu/explore/shakespeares-works/othello/read/3/3/","sources":["phrases"],"setting":"","speech":["Iago calls jealousy a monster that feeds on people. He warns Othello about it while trying to make him suspect his wife.","Today, we still call jealousy the green-eyed monster."]},{"name":"Lily-livered boy","kind":"Insult","place":"Dunsinane, Scotland","pin":"Dunsinane","xy":[436,190],"quote":"“Thou lily-livered boy.”","speaker":"Macbeth to a servant","play":"Macbeth","scene":"Act 5, scene 3","url":"https://www.folger.edu/explore/shakespeares-works/macbeth/read/5/3/","sources":["liver","scotland"],"setting":"The dot marks Dunsinane Hill.","speech":["When a servant reports an approaching army, Macbeth calls him “lily-livered.” People once believed a pale liver was a sign of cowardice.","Today, “lily-livered” still means cowardly, but it sounds old-fashioned."]},{"name":"You scullion!","kind":"Insult","place":"London, England","pin":"London","xy":[531,360],"quote":"“Away, you scullion…”","speaker":"Falstaff’s page during a brawl","play":"Henry IV, Part 2","scene":"Act 2, scene 1","url":"https://www.folger.edu/explore/shakespeares-works/henry-iv-part-2/read/2/1/","sources":["scullion"],"setting":"","speech":["During a street fight, Falstaff’s page calls someone a scullion. A scullion did the dirty work in a kitchen. The insult works because the page looks down on that job.","Today, the word is rare. As an insult, it sounds like “you nobody.”"]},{"name":"In a pickle","kind":"Idiom","place":"An unnamed island","pin":"An unnamed island","xy":null,"quote":"“How cam’st thou in this pickle?”","speaker":"Alonso to Trinculo","play":"The Tempest","scene":"Act 5, scene 1","url":"https://www.folger.edu/explore/shakespeares-works/the-tempest/read/5/1/","sources":["pickle","island"],"setting":"","speech":["Alonso finds Trinculo drunk and asks how he got into “this pickle.” Pickling keeps food from spoiling, so Trinculo jokes that the drink has preserved him, too.","Shakespeare helped popularize the saying. Today, being in a pickle means being in a tricky situation."]}];const sources={"phrases":{"name":"Shakespeare Birthplace Trust · Shakespeare’s Phrases","url":"https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/shakespeares-phrases/","why":"Modern meanings and references to the plays."},"origins":{"name":"Shakespeare Birthplace Trust · Historical background","url":"https://www.shakespeare.org.uk/documents/1220/PFS-Historical_Background-Game_4.pdf","why":"Why an early written example is not proof of invention."},"goose":{"name":"BBC Learning English · Wild-goose chase","url":"https://downloads.bbc.co.uk/learningenglish/shakespeare/bbc_shakespeare_wild-goose_chase.pdf","why":"The horse race behind Mercutio’s wordplay."},"pickle":{"name":"British Council · Eight Shakespeare phrases still used today","url":"https://englishonline.britishcouncil.org/blog/articles/eight-shakespeare-phrases-still-used-today/","why":"Modern meanings and earlier uses of “in a pickle.”"},"gold":{"name":"Harvard’s Geoffrey Chaucer Website · The Canon’s Yeoman’s Tale","url":"https://chaucer.fas.harvard.edu/pages/canons-yeomans-prologue-and-tale","why":"Lines 962–963 give an earlier version of the gold proverb, in Middle English and translation."},"belmont":{"name":"Royal Shakespeare Company · The setting of The Merchant of Venice","url":"https://www.rsc.org.uk/shakespeare-learning-zone/the-merchant-of-venice/staging/setting","why":"Distinguishes real Venice from Portia’s fictional home, Belmont."},"island":{"name":"Royal Shakespeare Company · The setting of The Tempest","url":"https://www.rsc.org.uk/shakespeare-learning-zone/the-tempest/staging/setting","why":"Describes Prospero’s remote island without assigning it a real location."},"scotland":{"name":"Atlas of Hillforts · Dunsinane Hill","url":"https://hillforts.arch.ox.ac.uk/records/SC3062.html","why":"Coordinates for the hill used as the map reference for the castle in the play."},"liver":{"name":"Journal of Hepatology · “The city of Hepar”","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3747976/","why":"The historical connection between a pale liver and cowardice."},"scullion":{"name":"Shakespeare’s Words · Glossary","url":"https://www.shakespeareswords.com/Public/Glossary.aspx?letter=s","why":"The historical meaning of “scullion.”"},"map":{"name":"Natural Earth · 1:50m land","url":"https://www.naturalearthdata.com/downloads/50m-physical-vectors/50m-land/","why":"Public-domain coastlines. Markers show approximate play settings."}};

});
let current=0;
function drawMap(){
  const s=stops[current], off=!s.xy;svg.style.display=off?'none':'block';$('unmapped').hidden=!off;if(off)return;

  const vw=w/scale,vh=h/scale;
  const clamp=(value,min,max)=>max<min?(min+max)/2:Math.min(max,Math.max(min,value));

function show(i){

    const section=document.createElement('section'),h=document.createElement('h3'),q=document.createElement('p'),ul=document.createElement('ul');

$('sources').onclick=()=>{dlg.showModal();dlg.scrollTop=0;$('close').focus()};$('close').onclick=()=>dlg.close();
